<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Post Assignment - Teacher Panel | Debre Markos Secondary School</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-green: #047857;
            --ethio-green: #078930;
            --ethio-yellow: #FCDD09;
            --ethio-red: #DA121A;
            --text-dark: #1f2937;
            --text-soft: #4b5563;
            --bg-light: #f9fafb;
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #f0f4f8;
        }

        .ethiopian-flag {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            height: 5px;
            z-index: 1001;
        }
        .ethiopian-flag .green { flex: 1; background: var(--ethio-green); }
        .ethiopian-flag .yellow { flex: 1; background: var(--ethio-yellow); }
        .ethiopian-flag .red { flex: 1; background: var(--ethio-red); }

        nav {
            width: 100%;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #e5e7eb;
            box-shadow: var(--shadow);
            position: fixed;
            top: 5px;
            left: 0;
            z-index: 999;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }
        .nav-logo {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-green);
        }
        .nav-logo i {
            margin-right: 8px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 30px;
            transition: all 0.3s;
        }
        .nav-links a:hover {
            background: var(--primary-green);
            color: white;
        }
        .nav-links a.active {
            background: var(--primary-green);
            color: white;
        }
        .nav-links a.logout {
            background: var(--ethio-red);
            color: white;
        }
        .nav-links a.logout:hover {
            background: #b91c1c;
        }

        .menu-toggle {
            display: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-dark);
        }

        .main-content {
            padding-top: 80px;
            max-width: 1000px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
        }

        .page-header {
            margin-bottom: 30px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
        }
        .page-header p {
            color: var(--text-soft);
            font-size: 15px;
        }

        /* Form Card */
        .form-card {
            background: white;
            border-radius: 24px;
            padding: 28px 30px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }
        .form-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--primary-green);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--ethio-yellow);
            padding-left: 15px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 18px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-dark);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            background: white;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.1);
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            padding: 10px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-success {
            background: var(--primary-green);
            color: white;
        }
        .btn-success:hover {
            background: #065f46;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(4, 120, 87, 0.3);
        }
        .btn-secondary {
            background: #e5e7eb;
            color: var(--text-dark);
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }
        .btn-danger {
            background: var(--ethio-red);
            color: white;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .btn-sm {
            padding: 5px 14px;
            font-size: 12px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .alert {
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .alert-success {
            background: #dcfce7;
            color: #166534;
            border-left: 4px solid #22c55e;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        /* Assignment List */
        .assignment-item {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transition: all 0.3s;
        }
        .assignment-item:hover {
            box-shadow: var(--shadow);
            border-color: var(--primary-green);
        }
        .assignment-item .info h4 {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-green);
        }
        .assignment-item .info p {
            font-size: 13px;
            color: var(--text-soft);
            margin-top: 3px;
        }
        .assignment-item .info .meta {
            font-size: 12px;
            color: var(--text-soft);
            margin-top: 4px;
        }
        .assignment-item .info .meta span {
            margin-right: 15px;
        }
        .assignment-status {
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            background: #dcfce7;
            color: #166534;
        }
        .assignment-status.closed {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-soft);
        }
        .empty-state i {
            font-size: 48px;
            opacity: 0.4;
            margin-bottom: 12px;
        }

        @media (max-width: 768px) {
            nav { padding: 10px 16px; }
            .nav-links { display: none; flex-direction: column; width: 100%; padding-top: 10px; }
            .nav-links.show { display: flex; }
            .nav-links a { width: 100%; text-align: center; padding: 8px; }
            .menu-toggle { display: block; }
            .form-row { grid-template-columns: 1fr; }
            .main-content { padding-top: 70px; padding-left: 12px; padding-right: 12px; }
            .form-card { padding: 20px; }
            .assignment-item { flex-direction: column; align-items: stretch; }
            .btn-group { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="ethiopian-flag">
        <div class="green"></div>
        <div class="yellow"></div>
        <div class="red"></div>
    </div>

    <nav>
        <div class="nav-container">
            <div class="nav-logo"><i class="fas fa-school"></i> DMSS</div>
            <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
            <div class="nav-links" id="navLinks">
                <a href="/teacherhome">← Back</a>
                <a href="/post-attendance">Attendance</a>
                <a href="/post-assignment" class="active">Assignments</a>
                <a href="/post-result">Results</a>
                <a href="/profile">Profile</a>
                <a href="/logout" class="logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-header">
            <h1>📝 Post Assignment</h1>
            <p>Create and manage student assignments</p>
        </div>

        <div id="alertMessage" class="alert"></div>

        <!-- Create Assignment Form -->
        <div class="form-card">
            <div class="form-title"><i class="fas fa-plus-circle"></i> Create New Assignment</div>
            <form id="assignmentForm" onsubmit="postAssignment(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Subject *</label>
                        <select id="subject" required>
                            <option value="">Select Subject</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="English">English</option>
                            <option value="Physics">Physics</option>
                            <option value="Chemistry">Chemistry</option>
                            <option value="Biology">Biology</option>
                            <option value="History">History</option>
                            <option value="Geography">Geography</option>
                            <option value="ICT">ICT</option>
                            <option value="Amharic">Amharic</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Grade *</label>
                        <select id="grade" required>
                            <option value="">Select Grade</option>
                            <option value="Grade 8">Grade 8</option>
                            <option value="Grade 9">Grade 9</option>
                            <option value="Grade 10">Grade 10</option>
                            <option value="Grade 11">Grade 11</option>
                            <option value="Grade 12">Grade 12</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Section *</label>
                        <select id="section" required>
                            <option value="">Select Section</option>
                            <option value="A">Section A</option>
                            <option value="B">Section B</option>
                            <option value="C">Section C</option>
                            <option value="D">Section D</option>
                            <option value="All">All Sections</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Assignment Title *</label>
                        <input type="text" id="title" placeholder="e.g., Algebra Worksheet" required>
                    </div>
                    <div class="form-group">
                        <label>Due Date *</label>
                        <input type="date" id="dueDate" required>
                    </div>
                    <div class="form-group">
                        <label>Total Marks *</label>
                        <input type="number" id="totalMarks" placeholder="e.g., 50" min="1" max="100" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description / Instructions *</label>
                    <textarea id="description" placeholder="Describe the assignment, provide instructions, and mention any specific requirements..." required></textarea>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-success"><i class="fas fa-paper-plane"></i> Post Assignment</button>
                    <button type="reset" class="btn btn-secondary"><i class="fas fa-undo"></i> Clear Form</button>
                </div>
            </form>
        </div>

        <!-- Posted Assignments -->
        <div class="form-card">
            <div class="form-title"><i class="fas fa-list"></i> Posted Assignments</div>
            <div id="assignmentsList"></div>
        </div>
    </div>

    <script>
        // ============================================
        // Toggle Mobile Menu
        // ============================================

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('show');
        }

        // ============================================
        // Get Current User
        // ============================================

        const currentUser = JSON.parse(sessionStorage.getItem('current_user')) || JSON.parse(localStorage.getItem('current_user'));

        if (!currentUser || currentUser.role !== 'teacher') {
            window.location.href = '/login';
        }

        // ============================================
        // Load Assignments
        // ============================================

        let assignments = JSON.parse(localStorage.getItem('teacher_assignments')) || [];

        // ============================================
        // Render Assignments List
        // ============================================

        function renderAssignments() {
            const container = document.getElementById('assignmentsList');
            
            if (assignments.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-tasks"></i>
                        <p>No assignments posted yet.</p>
                        <p style="font-size: 13px; margin-top: 5px;">Create your first assignment using the form above.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = assignments.map(a => `
                <div class="assignment-item">
                    <div class="info">
                        <h4>📚 ${a.title}</h4>
                        <p>${a.subject} | ${a.grade} - ${a.section}</p>
                        <div class="meta">
                            <span><i class="fas fa-calendar"></i> Due: ${a.dueDate}</span>
                            <span><i class="fas fa-star"></i> Marks: ${a.totalMarks}</span>
                            <span><i class="fas fa-user"></i> ${a.teacher || 'Teacher'}</span>
                            <span><i class="fas fa-clock"></i> ${new Date(a.createdAt).toLocaleDateString()}</span>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                        <span class="assignment-status ${a.status === 'closed' ? 'closed' : ''}">
                            ${a.status === 'active' ? '✅ Active' : '🔒 Closed'}
                        </span>
                        <div style="display: flex; gap: 6px;">
                            ${a.status === 'active' ? `
                                <button class="btn btn-secondary btn-sm" onclick="toggleStatus(${a.id})">
                                    <i class="fas fa-ban"></i> Close
                                </button>
                            ` : `
                                <button class="btn btn-success btn-sm" onclick="toggleStatus(${a.id})">
                                    <i class="fas fa-check"></i> Reopen
                                </button>
                            `}
                            <button class="btn btn-danger btn-sm" onclick="deleteAssignment(${a.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // Post Assignment
        // ============================================

        function postAssignment(e) {
            e.preventDefault();

            const subject = document.getElementById('subject').value;
            const grade = document.getElementById('grade').value;
            const section = document.getElementById('section').value;
            const title = document.getElementById('title').value.trim();
            const dueDate = document.getElementById('dueDate').value;
            const totalMarks = document.getElementById('totalMarks').value;
            const description = document.getElementById('description').value.trim();

            if (!subject || !grade || !section || !title || !dueDate || !totalMarks || !description) {
                showAlert('Please fill in all fields.', 'error');
                return;
            }

            const newAssignment = {
                id: Date.now(),
                subject: subject,
                grade: grade,
                section: section,
                title: title,
                dueDate: dueDate,
                totalMarks: parseInt(totalMarks),
                description: description,
                teacher: currentUser?.name || 'Teacher',
                status: 'active',
                createdAt: new Date().toISOString()
            };

            assignments.unshift(newAssignment);
            localStorage.setItem('teacher_assignments', JSON.stringify(assignments));

            document.getElementById('assignmentForm').reset();

            // Set default date again
            const defaultDate = new Date();
            defaultDate.setDate(defaultDate.getDate() + 7);
            document.getElementById('dueDate').value = defaultDate.toISOString().split('T')[0];

            showAlert('✅ Assignment posted successfully! Students can now view it.', 'success');
            renderAssignments();
        }

        // ============================================
        // Toggle Status (Active/Closed)
        // ============================================

        function toggleStatus(id) {
            const assignment = assignments.find(a => a.id === id);
            if (assignment) {
                assignment.status = assignment.status === 'active' ? 'closed' : 'active';
                localStorage.setItem('teacher_assignments', JSON.stringify(assignments));
                renderAssignments();
                showAlert(`✅ Assignment ${assignment.status === 'active' ? 'reopened' : 'closed'} successfully.`, 'success');
            }
        }

        // ============================================
        // Delete Assignment
        // ============================================

        function deleteAssignment(id) {
            if (confirm('Are you sure you want to delete this assignment? This action cannot be undone.')) {
                assignments = assignments.filter(a => a.id !== id);
                localStorage.setItem('teacher_assignments', JSON.stringify(assignments));
                renderAssignments();
                showAlert('✅ Assignment deleted successfully.', 'success');
            }
        }

        // ============================================
        // Show Alert
        // ============================================

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.innerHTML = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 4000);
        }

        // ============================================
        // Set Default Date (7 days from now)
        // ============================================

        const defaultDate = new Date();
        defaultDate.setDate(defaultDate.getDate() + 7);
        document.getElementById('dueDate').value = defaultDate.toISOString().split('T')[0];

        // ============================================
        // Initial Render
        // ============================================

        renderAssignments();
    </script>
</body>
</html>
