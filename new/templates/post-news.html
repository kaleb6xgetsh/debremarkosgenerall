<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Post News - Admin Panel | Debre Markos Secondary School</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-green: #047857;
            --ethio-green: #078930;
            --ethio-yellow: #FCDD09;
            --ethio-red: #DA121A;
            --text-dark: #1f2937;
            --text-soft: #4b5563;
            --bg-light: #f9fafb;
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #f0f4f8;
        }

        .ethiopian-flag {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            height: 5px;
            z-index: 1001;
        }
        .ethiopian-flag .green { flex: 1; background: var(--ethio-green); }
        .ethiopian-flag .yellow { flex: 1; background: var(--ethio-yellow); }
        .ethiopian-flag .red { flex: 1; background: var(--ethio-red); }

        nav {
            width: 100%;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #e5e7eb;
            box-shadow: var(--shadow);
            position: fixed;
            top: 5px;
            left: 0;
            z-index: 999;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }
        .nav-logo {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-green);
        }
        .nav-logo i {
            margin-right: 8px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 30px;
            transition: all 0.3s;
        }
        .nav-links a:hover {
            background: var(--primary-green);
            color: white;
        }
        .nav-links a.active {
            background: var(--primary-green);
            color: white;
        }
        .nav-links a.logout {
            background: var(--ethio-red);
            color: white;
        }
        .nav-links a.logout:hover {
            background: #b91c1c;
        }

        .menu-toggle {
            display: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-dark);
        }

        .main-content {
            padding-top: 80px;
            max-width: 1000px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
        }

        .page-header {
            margin-bottom: 25px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
        }
        .page-header p {
            color: var(--text-soft);
            font-size: 15px;
        }

        .form-card {
            background: white;
            border-radius: 24px;
            padding: 28px 30px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }
        .form-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--primary-green);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--ethio-yellow);
            padding-left: 15px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-dark);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            background: white;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.1);
        }
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .btn {
            display: inline-block;
            padding: 10px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-success {
            background: var(--primary-green);
            color: white;
        }
        .btn-success:hover {
            background: #065f46;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(4, 120, 87, 0.3);
        }
        .btn-secondary {
            background: #e5e7eb;
            color: var(--text-dark);
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }
        .btn-danger {
            background: var(--ethio-red);
            color: white;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .btn-sm {
            padding: 5px 14px;
            font-size: 12px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .alert {
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .alert-success {
            background: #dcfce7;
            color: #166534;
            border-left: 4px solid #22c55e;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .news-item {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            transition: all 0.3s;
        }
        .news-item:hover {
            box-shadow: var(--shadow);
            border-color: var(--primary-green);
        }
        .news-item .info h4 {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-green);
        }
        .news-item .info p {
            font-size: 13px;
            color: var(--text-soft);
            margin-top: 3px;
        }
        .news-item .info .meta {
            font-size: 12px;
            color: var(--text-soft);
            margin-top: 4px;
        }
        .news-item .info .meta span {
            margin-right: 15px;
        }
        .news-item .category-tag {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
        }
        .tag-announcement { background: #e0f2fe; color: #0369a1; }
        .tag-event { background: #fef3c7; color: #92400e; }
        .tag-academic { background: #dcfce7; color: #166534; }
        .tag-sports { background: #e0f2fe; color: #1e40af; }
        .tag-achievement { background: #fce7f3; color: #9d174d; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-soft);
        }
        .empty-state i {
            font-size: 48px;
            opacity: 0.4;
            margin-bottom: 12px;
        }

        @media (max-width: 768px) {
            nav { padding: 10px 16px; }
            .nav-links { display: none; flex-direction: column; width: 100%; padding-top: 10px; }
            .nav-links.show { display: flex; }
            .nav-links a { width: 100%; text-align: center; padding: 8px; }
            .menu-toggle { display: block; }
            .form-card { padding: 20px; }
            .main-content { padding-top: 70px; padding-left: 12px; padding-right: 12px; }
            .news-item { flex-direction: column; align-items: stretch; }
            .btn-group { justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="ethiopian-flag">
        <div class="green"></div>
        <div class="yellow"></div>
        <div class="red"></div>
    </div>

    <nav>
        <div class="nav-container">
            <div class="nav-logo"><i class="fas fa-school"></i> DMSS</div>
            <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
            <div class="nav-links" id="navLinks">
                <a href="/adminhome">← Back</a>
                <a href="/admin-report">Reports</a>
                <a href="/post-news" class="active">Post News</a>
                <a href="/manage-teachers">Teachers</a>
                <a href="/manage-students">Students</a>
                <a href="/manage-parents">Parents</a>
                <a href="/profile">Profile</a>
                <a href="/logout" class="logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-header">
            <h1>📰 Post News</h1>
            <p>Create and manage school news and announcements</p>
        </div>

        <div id="alertMessage" class="alert"></div>

        <!-- Create News Form -->
        <div class="form-card">
            <div class="form-title"><i class="fas fa-plus-circle"></i> Create New Post</div>
            <form id="newsForm" onsubmit="postNews(event)">
                <div class="form-group">
                    <label>News Title *</label>
                    <input type="text" id="newsTitle" placeholder="Enter news title" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="newsCategory" required>
                        <option value="">Select Category</option>
                        <option value="announcement">📢 Announcement</option>
                        <option value="event">🎉 Event</option>
                        <option value="academic">📚 Academic</option>
                        <option value="sports">⚽ Sports</option>
                        <option value="achievement">🏆 Achievement</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Content *</label>
                    <textarea id="newsContent" placeholder="Write your news content here..." required></textarea>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-success"><i class="fas fa-paper-plane"></i> Publish News</button>
                    <button type="reset" class="btn btn-secondary"><i class="fas fa-undo"></i> Clear</button>
                </div>
            </form>
        </div>

        <!-- Posted News List -->
        <div class="form-card">
            <div class="form-title"><i class="fas fa-list"></i> Posted News</div>
            <div id="newsList"></div>
        </div>
    </div>

    <script>
        // ============================================
        // Toggle Mobile Menu
        // ============================================

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('show');
        }

        // ============================================
        // Get Current User
        // ============================================

        const currentUser = JSON.parse(sessionStorage.getItem('current_user')) || JSON.parse(localStorage.getItem('current_user'));

        if (!currentUser || currentUser.role !== 'admin') {
            window.location.href = '/login';
        }

        // ============================================
        // Load News
        // ============================================

        let newsList = JSON.parse(localStorage.getItem('school_news')) || [];

        // ============================================
        // Render News List
        // ============================================

        function renderNews() {
            const container = document.getElementById('newsList');
            
            if (newsList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-newspaper"></i>
                        <p>No news posted yet.</p>
                        <p style="font-size: 13px; margin-top: 5px;">Create your first news post using the form above.</p>
                    </div>
                `;
                return;
            }

            const tagClasses = {
                announcement: 'tag-announcement',
                event: 'tag-event',
                academic: 'tag-academic',
                sports: 'tag-sports',
                achievement: 'tag-achievement'
            };

            const categoryLabels = {
                announcement: '📢 Announcement',
                event: '🎉 Event',
                academic: '📚 Academic',
                sports: '⚽ Sports',
                achievement: '🏆 Achievement'
            };

            // Sort by date (newest first)
            const sorted = [...newsList].sort((a, b) => new Date(b.date) - new Date(a.date));

            container.innerHTML = sorted.map(item => `
                <div class="news-item">
                    <div class="info">
                        <h4>📰 ${item.title}</h4>
                        <p>
                            <span class="category-tag ${tagClasses[item.category] || ''}">${categoryLabels[item.category] || item.category}</span>
                        </p>
                        <div class="meta">
                            <span><i class="fas fa-calendar"></i> ${item.date}</span>
                            <span><i class="fas fa-user"></i> ${item.author || 'Admin'}</span>
                        </div>
                        <p style="font-size: 13px; color: var(--text-soft); margin-top: 6px;">${item.content.substring(0, 120)}${item.content.length > 120 ? '...' : ''}</p>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="btn btn-danger btn-sm" onclick="deleteNews(${item.id})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // Post News
        // ============================================

        function postNews(e) {
            e.preventDefault();

            const title = document.getElementById('newsTitle').value.trim();
            const category = document.getElementById('newsCategory').value;
            const content = document.getElementById('newsContent').value.trim();

            if (!title || !category || !content) {
                showAlert('Please fill in all fields.', 'error');
                return;
            }

            const newNews = {
                id: Date.now(),
                title: title,
                category: category,
                content: content,
                date: new Date().toISOString().split('T')[0],
                author: currentUser?.name || 'Admin',
                created_at: new Date().toISOString()
            };

            newsList.push(newNews);
            localStorage.setItem('school_news', JSON.stringify(newsList));

            document.getElementById('newsForm').reset();
            showAlert('✅ News posted successfully!', 'success');
            renderNews();
        }

        // ============================================
        // Delete News
        // ============================================

        function deleteNews(id) {
            if (confirm('Delete this news post? This action cannot be undone.')) {
                newsList = newsList.filter(item => item.id !== id);
                localStorage.setItem('school_news', JSON.stringify(newsList));
                renderNews();
                showAlert('✅ News deleted successfully.', 'success');
            }
        }

        // ============================================
        // Show Alert
        // ============================================

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.innerHTML = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 4000);
        }

        // ============================================
        // Initial Render
        // ============================================

        renderNews();
    </script>
</body>
</html>
