<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Post Results - Teacher Panel | Debre Markos Secondary School</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-green: #047857;
            --ethio-green: #078930;
            --ethio-yellow: #FCDD09;
            --ethio-red: #DA121A;
            --text-dark: #1f2937;
            --text-soft: #4b5563;
            --bg-light: #f9fafb;
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #f0f4f8;
        }

        .ethiopian-flag {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            height: 5px;
            z-index: 1001;
        }
        .ethiopian-flag .green { flex: 1; background: var(--ethio-green); }
        .ethiopian-flag .yellow { flex: 1; background: var(--ethio-yellow); }
        .ethiopian-flag .red { flex: 1; background: var(--ethio-red); }

        nav {
            width: 100%;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #e5e7eb;
            box-shadow: var(--shadow);
            position: fixed;
            top: 5px;
            left: 0;
            z-index: 999;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }
        .nav-logo {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-green);
        }
        .nav-logo i {
            margin-right: 8px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 30px;
            transition: all 0.3s;
        }
        .nav-links a:hover {
            background: var(--primary-green);
            color: white;
        }
        .nav-links a.active {
            background: var(--primary-green);
            color: white;
        }
        .nav-links a.logout {
            background: var(--ethio-red);
            color: white;
        }
        .nav-links a.logout:hover {
            background: #b91c1c;
        }

        .menu-toggle {
            display: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-dark);
        }

        .main-content {
            padding-top: 80px;
            max-width: 1100px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
        }

        .page-header {
            margin-bottom: 30px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
        }
        .page-header p {
            color: var(--text-soft);
            font-size: 15px;
        }

        .form-card {
            background: white;
            border-radius: 24px;
            padding: 25px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }
        .form-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-green);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--ethio-yellow);
            padding-left: 15px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-bottom: 18px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-dark);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            background: white;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        .btn {
            display: inline-block;
            padding: 10px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-success {
            background: var(--primary-green);
            color: white;
        }
        .btn-success:hover {
            background: #065f46;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #e5e7eb;
            color: var(--text-dark);
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }
        .btn-danger {
            background: var(--ethio-red);
            color: white;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
        }
        .alert-success {
            background: #dcfce7;
            color: #166534;
            border-left: 4px solid #22c55e;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .students-table-container {
            overflow-x: auto;
            margin-top: 15px;
        }
        .students-table {
            width: 100%;
            border-collapse: collapse;
        }
        .students-table th {
            background: var(--primary-green);
            color: white;
            padding: 10px 12px;
            text-align: left;
        }
        .students-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e5e7eb;
        }
        .students-table tr:hover {
            background: #f3f4f6;
        }
        .students-table input[type="number"] {
            width: 70px;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            font-family: 'Poppins', sans-serif;
        }
        .students-table input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }
        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }
        .summary-card .number {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-green);
        }
        .summary-card .label {
            font-size: 11px;
            color: var(--text-soft);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .result-item {
            background: white;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .result-item:hover {
            box-shadow: var(--shadow);
        }
        .result-item .info h4 {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary-green);
        }
        .result-item .info p {
            font-size: 13px;
            color: var(--text-soft);
        }

        @media (max-width: 768px) {
            nav { padding: 10px 16px; }
            .nav-links { display: none; flex-direction: column; width: 100%; padding-top: 10px; }
            .nav-links.show { display: flex; }
            .nav-links a { width: 100%; text-align: center; padding: 8px; }
            .menu-toggle { display: block; }
            .form-row { grid-template-columns: 1fr; }
            .main-content { padding-top: 70px; }
            .students-table { font-size: 12px; }
            .students-table th, .students-table td { padding: 6px 8px; }
        }
    </style>
</head>
<body>

    <div class="ethiopian-flag">
        <div class="green"></div>
        <div class="yellow"></div>
        <div class="red"></div>
    </div>

    <nav>
        <div class="nav-container">
            <div class="nav-logo"><i class="fas fa-school"></i> DMSS</div>
            <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
            <div class="nav-links" id="navLinks">
                <a href="/teacherhome">← Back</a>
                <a href="/post-attendance">Attendance</a>
                <a href="/post-assignment">Assignments</a>
                <a href="/post-result" class="active">Post Results</a>
                <a href="/profile">Profile</a>
                <a href="/logout" class="logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-header">
            <h1>📊 Post Exam Results</h1>
            <p>Enter student examination scores</p>
        </div>

        <div id="alertMessage" class="alert"></div>

        <!-- Select Exam Details -->
        <div class="form-card">
            <div class="form-title"><i class="fas fa-school"></i> Select Exam Details</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Grade</label>
                    <select id="gradeSelect" onchange="loadStudents()">
                        <option value="">Select Grade</option>
                        <option value="Grade 8">Grade 8</option>
                        <option value="Grade 9">Grade 9</option>
                        <option value="Grade 10">Grade 10</option>
                        <option value="Grade 11">Grade 11</option>
                        <option value="Grade 12">Grade 12</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Section</label>
                    <select id="sectionSelect" onchange="loadStudents()">
                        <option value="">Select Section</option>
                        <option value="A">Section A</option>
                        <option value="B">Section B</option>
                        <option value="C">Section C</option>
                        <option value="D">Section D</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <select id="subjectSelect" onchange="loadStudents()">
                        <option value="">Select Subject</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="English">English</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Biology">Biology</option>
                        <option value="History">History</option>
                        <option value="Geography">Geography</option>
                        <option value="ICT">ICT</option>
                        <option value="Amharic">Amharic</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Exam Type</label>
                    <select id="examSelect" onchange="loadStudents()">
                        <option value="">Select Exam</option>
                        <option value="Term 1">Term 1</option>
                        <option value="Term 2">Term 2</option>
                        <option value="Final">Final Exam</option>
                        <option value="Quiz">Quiz</option>
                        <option value="Mid-Term">Mid-Term</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-secondary" onclick="loadStudents()"><i class="fas fa-users"></i> Load Students</button>
        </div>

        <!-- Student Results -->
        <div id="studentsSection" class="form-card" style="display:none;">
            <div class="form-title"><i class="fas fa-user-graduate"></i> Student Results</div>

            <div class="summary-stats">
                <div class="summary-card"><div class="number" id="totalCount">0</div><div class="label">Students</div></div>
                <div class="summary-card"><div class="number" id="avgScore">-</div><div class="label">Average</div></div>
                <div class="summary-card"><div class="number" id="topScore">-</div><div class="label">Highest</div></div>
            </div>

            <div class="students-table-container">
                <table class="students-table">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Student ID</th>
                            <th>Score (Out of 100)</th>
                            <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody"></tbody>
                </table>
            </div>

            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="clearResults()"><i class="fas fa-eraser"></i> Clear All</button>
                <button class="btn btn-success" onclick="submitResults()"><i class="fas fa-save"></i> Publish Results</button>
            </div>
        </div>

        <!-- Posted Results -->
        <div class="form-card">
            <div class="form-title"><i class="fas fa-list"></i> Posted Results</div>
            <div id="resultsList"></div>
        </div>
    </div>

    <script>
        // ============================================
        // Toggle Mobile Menu
        // ============================================

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('show');
        }

        // ============================================
        // Get Current User
        // ============================================

        const currentUser = JSON.parse(sessionStorage.getItem('current_user')) || JSON.parse(localStorage.getItem('current_user'));

        if (!currentUser || currentUser.role !== 'teacher') {
            window.location.href = '/login';
        }

        // ============================================
        // Students Database
        // ============================================

        const studentsDB = {
            "Grade 8": {
                "A": [
                    { id: "DM-2024-101", name: "Abel Tsegaye" },
                    { id: "DM-2024-102", name: "Bontu Fikre" },
                    { id: "DM-2024-103", name: "Chaltu Hussein" },
                    { id: "DM-2024-104", name: "Dawit Assefa" },
                    { id: "DM-2024-105", name: "Eyerusalem Getachew" }
                ]
            },
            "Grade 9": {
                "A": [
                    { id: "DM-2024-201", name: "Biruk Alemu" },
                    { id: "DM-2024-202", name: "Selam Tesfaye" },
                    { id: "DM-2024-203", name: "Henok Desta" },
                    { id: "DM-2024-204", name: "Bethel Assefa" }
                ]
            },
            "Grade 10": {
                "A": [
                    { id: "DM-2024-301", name: "Yonas Kebede" },
                    { id: "DM-2024-302", name: "Eden Girma" },
                    { id: "DM-2024-303", name: "Nahom Tekle" },
                    { id: "DM-2024-304", name: "Hanan Mohammed" },
                    { id: "DM-2024-305", name: "Mekdes Wondimu" }
                ]
            }
        };

        let currentStudents = [];
        let studentScores = [];

        // ============================================
        // Load Results
        // ============================================

        let allResults = JSON.parse(localStorage.getItem('exam_results_data')) || [];

        function renderResultsList() {
            const container = document.getElementById('resultsList');
            if (allResults.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color: var(--text-soft);">No results published yet.</div>';
                return;
            }

            container.innerHTML = allResults.slice().reverse().map(r => `
                <div class="result-item">
                    <div class="info">
                        <h4>📚 ${r.subject} - ${r.examType}</h4>
                        <p>${r.grade} - Section ${r.section} | ${r.scores ? r.scores.length : 0} students | Teacher: ${r.teacher || 'N/A'}</p>
                    </div>
                    <button class="btn btn-danger btn-sm" onclick="deleteResult(${r.id})"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
        }

        function deleteResult(id) {
            if (confirm('Delete these results?')) {
                allResults = allResults.filter(r => r.id !== id);
                localStorage.setItem('exam_results_data', JSON.stringify(allResults));
                renderResultsList();
            }
        }

        // ============================================
        // Load Students
        // ============================================

        function loadStudents() {
            const grade = document.getElementById('gradeSelect').value;
            const section = document.getElementById('sectionSelect').value;
            const subject = document.getElementById('subjectSelect').value;
            const exam = document.getElementById('examSelect').value;

            if (!grade || !section || !subject || !exam) {
                document.getElementById('studentsSection').style.display = 'none';
                return;
            }

            if (studentsDB[grade] && studentsDB[grade][section]) {
                currentStudents = studentsDB[grade][section];
                
                // Check if results already exist
                const existing = allResults.find(r => r.grade === grade && r.section === section && r.subject === subject && r.examType === exam);
                
                if (existing && existing.scores) {
                    studentScores = existing.scores.map(s => ({
                        studentId: s.studentId,
                        name: s.name,
                        score: s.score || '',
                        grade: s.grade || ''
                    }));
                    // Fill any missing students
                    currentStudents.forEach(s => {
                        if (!studentScores.find(r => r.studentId === s.id)) {
                            studentScores.push({
                                studentId: s.id,
                                name: s.name,
                                score: '',
                                grade: ''
                            });
                        }
                    });
                } else {
                    studentScores = currentStudents.map(student => ({
                        studentId: student.id,
                        name: student.name,
                        score: '',
                        grade: ''
                    }));
                }

                renderStudentTable();
                updateSummary();
                document.getElementById('studentsSection').style.display = 'block';
            } else {
                alert('No students found for the selected grade and section.');
            }
        }

        // ============================================
        // Render Student Table
        // ============================================

        function calculateGrade(score) {
            if (score >= 90) return 'A';
            if (score >= 80) return 'B';
            if (score >= 70) return 'C';
            if (score >= 60) return 'D';
            return 'F';
        }

        function renderStudentTable() {
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = studentScores.map((student, index) => `
                <tr>
                    <td><strong>${student.name}</strong></td>
                    <td>${student.studentId}</td>
                    <td>
                        <input type="number" id="score_${index}" value="${student.score}" 
                            min="0" max="100" onchange="updateScore(${index}, this.value)" 
                            placeholder="0-100">
                    </td>
                    <td id="grade_${index}">${student.grade || '-'}</td>
                </tr>
            `).join('');
        }

        function updateScore(index, value) {
            const score = parseFloat(value);
            if (!isNaN(score) && score >= 0 && score <= 100) {
                studentScores[index].score = score;
                studentScores[index].grade = calculateGrade(score);
                document.getElementById(`grade_${index}`).innerHTML = studentScores[index].grade;
                updateSummary();
            }
        }

        // ============================================
        // Update Summary
        // ============================================

        function updateSummary() {
            const scores = studentScores.filter(s => s.score !== '' && !isNaN(s.score)).map(s => parseFloat(s.score));
            const total = studentScores.length;
            document.getElementById('totalCount').innerHTML = total;
            
            if (scores.length > 0) {
                const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
                const max = Math.max(...scores);
                document.getElementById('avgScore').innerHTML = avg.toFixed(1) + '%';
                document.getElementById('topScore').innerHTML = max + '%';
            } else {
                document.getElementById('avgScore').innerHTML = '-';
                document.getElementById('topScore').innerHTML = '-';
            }
        }

        // ============================================
        // Clear Results
        // ============================================

        function clearResults() {
            if (confirm('Clear all entered scores?')) {
                studentScores = studentScores.map(s => ({ ...s, score: '', grade: '' }));
                renderStudentTable();
                updateSummary();
            }
        }

        // ============================================
        // Submit Results
        // ============================================

        function submitResults() {
            const grade = document.getElementById('gradeSelect').value;
            const section = document.getElementById('sectionSelect').value;
            const subject = document.getElementById('subjectSelect').value;
            const exam = document.getElementById('examSelect').value;

            const emptyScores = studentScores.filter(s => s.score === '' || isNaN(s.score));
            if (emptyScores.length > 0) {
                if (!confirm(`${emptyScores.length} student(s) have no score entered. Continue anyway?`)) {
                    return;
                }
            }

            const resultData = {
                id: Date.now(),
                grade: grade,
                section: section,
                subject: subject,
                examType: exam,
                scores: studentScores.map(s => ({
                    studentId: s.studentId,
                    name: s.name,
                    score: s.score || 0,
                    grade: s.grade || 'F'
                })),
                teacher: currentUser?.name || 'Teacher',
                publishedAt: new Date().toISOString()
            };

            // Remove existing entry
            allResults = allResults.filter(r => !(r.grade === grade && r.section === section && r.subject === subject && r.examType === exam));
            allResults.push(resultData);
            localStorage.setItem('exam_results_data', JSON.stringify(allResults));

            document.getElementById('studentsSection').style.display = 'none';
            document.getElementById('gradeSelect').value = '';
            document.getElementById('sectionSelect').value = '';
            document.getElementById('subjectSelect').value = '';
            document.getElementById('examSelect').value = '';

            const alertDiv = document.getElementById('alertMessage');
            alertDiv.innerHTML = '✅ Results published successfully! Students can now view them.';
            alertDiv.className = 'alert alert-success';
            alertDiv.style.display = 'block';
            setTimeout(() => { alertDiv.style.display = 'none'; }, 4000);

            renderResultsList();
        }

        renderResultsList();
    </script>
</body>
</html>
