<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Attendance - Debre Markos Secondary School</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-green: #047857;
            --ethio-green: #078930;
            --ethio-yellow: #FCDD09;
            --ethio-red: #DA121A;
            --text-dark: #1f2937;
            --text-soft: #4b5563;
            --bg-light: #f9fafb;
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            --present: #22c55e;
            --absent: #ef4444;
            --late: #f59e0b;
            --holiday: #8b5cf6;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #f0f4f8;
        }

        .ethiopian-flag {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            height: 5px;
            z-index: 1001;
        }
        .ethiopian-flag .green { flex: 1; background: var(--ethio-green); }
        .ethiopian-flag .yellow { flex: 1; background: var(--ethio-yellow); }
        .ethiopian-flag .red { flex: 1; background: var(--ethio-red); }

        nav {
            width: 100%;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #e5e7eb;
            box-shadow: var(--shadow);
            position: fixed;
            top: 5px;
            left: 0;
            z-index: 999;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }
        .nav-logo {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-green);
        }
        .nav-logo i {
            margin-right: 8px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 30px;
            transition: all 0.3s;
        }
        .nav-links a:hover {
            background: var(--primary-green);
            color: white;
        }
        .nav-links a.active {
            background: var(--primary-green);
            color: white;
        }
        .nav-links a.logout {
            background: var(--ethio-red);
            color: white;
        }
        .nav-links a.logout:hover {
            background: #b91c1c;
        }

        .menu-toggle {
            display: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-dark);
        }

        .main-content {
            padding-top: 80px;
            max-width: 1100px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
        }

        .page-header {
            margin-bottom: 30px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
        }
        .page-header p {
            color: var(--text-soft);
            font-size: 15px;
        }

        /* Child Selector (for parents) */
        .child-selector {
            background: white;
            border-radius: 20px;
            padding: 18px 22px;
            margin-bottom: 25px;
            box-shadow: var(--shadow);
            display: none;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }
        .child-selector label {
            font-weight: 600;
            color: var(--text-dark);
        }
        .child-selector select {
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #e5e7eb;
            font-family: 'Poppins', sans-serif;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 18px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: white;
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            border: 1px solid #e5e7eb;
            box-shadow: var(--shadow);
        }
        .stat-card .value {
            font-size: 30px;
            font-weight: 800;
        }
        .stat-card .label {
            font-size: 12px;
            color: var(--text-soft);
            margin-top: 4px;
        }
        .stat-card.present .value { color: var(--present); }
        .stat-card.absent .value { color: var(--absent); }
        .stat-card.rate .value { color: var(--primary-green); }

        /* Calendar Table */
        .calendar-container {
            overflow-x: auto;
            margin-bottom: 25px;
        }
        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .calendar-table th {
            background: var(--primary-green);
            color: white;
            padding: 12px 14px;
            text-align: center;
            font-weight: 600;
        }
        .calendar-table td {
            padding: 10px 14px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }
        .calendar-table tr:hover {
            background: #f3f4f6;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .badge-present { background: #dcfce7; color: #166534; }
        .badge-absent { background: #fee2e2; color: #991b1b; }
        .badge-late { background: #fef3c7; color: #92400e; }
        .badge-holiday { background: #ede9fe; color: #6d28d9; }

        /* Chart */
        .chart-container {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            margin-top: 20px;
        }
        .chart-container h3 {
            font-size: 18px;
            color: var(--text-dark);
            margin-bottom: 18px;
        }
        .week-bars {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .bar-item {
            text-align: center;
            flex: 1;
            min-width: 60px;
        }
        .bar {
            background: linear-gradient(180deg, var(--primary-green), #065f46);
            height: 120px;
            border-radius: 12px 12px 0 0;
            margin-bottom: 8px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 6px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            transition: height 0.5s ease;
        }
        .bar-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-soft);
        }

        .no-records {
            text-align: center;
            padding: 40px;
            color: var(--text-soft);
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow);
        }
        .no-records i {
            font-size: 48px;
            opacity: 0.5;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-primary {
            background: var(--ethio-red);
            color: white;
        }
        .btn-primary:hover {
            background: transparent;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            nav { padding: 10px 16px; }
            .nav-links { display: none; flex-direction: column; width: 100%; padding-top: 10px; }
            .nav-links.show { display: flex; }
            .nav-links a { width: 100%; text-align: center; padding: 8px; }
            .menu-toggle { display: block; }
            .main-content { padding-top: 70px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .calendar-table { font-size: 12px; }
            .calendar-table th, .calendar-table td { padding: 6px 8px; }
        }
    </style>
</head>
<body>

    <div class="ethiopian-flag">
        <div class="green"></div>
        <div class="yellow"></div>
        <div class="red"></div>
    </div>

    <nav>
        <div class="nav-container">
            <div class="nav-logo"><i class="fas fa-school"></i> DMSS</div>
            <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
            <div class="nav-links" id="navLinks">
                <a href="#" id="backLink">← Back</a>
                <a href="/results">Results</a>
                <a href="/attendance" class="active">Attendance</a>
                <a href="/assignment">Assignments</a>
                <a href="/profile">Profile</a>
                <a href="/logout" class="logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="main-content" id="mainContent">
        <!-- Rendered by JavaScript -->
    </div>

    <script>
        // ============================================
        // Toggle Mobile Menu
        // ============================================

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('show');
        }

        // ============================================
        // Get Current User
        // ============================================

        const currentUser = JSON.parse(sessionStorage.getItem('current_user')) || JSON.parse(localStorage.getItem('current_user'));

        if (!currentUser) {
            window.location.href = '/login';
        }

        const roleLinks = {
            'student': 'studenthome.html',
            'teacher': 'teacherhome.html',
            'parent': 'parenthome.html',
            'admin': 'adminhome.html'
        };
        document.getElementById('backLink').href = roleLinks[currentUser.role] || 'index.html';

        // ============================================
        // Get User Profile
        // ============================================

        let userProfile = JSON.parse(localStorage.getItem(`user_profile_${currentUser.email}`)) || currentUser;

        // ============================================
        // Load Attendance Data
        // ============================================

        let allAttendance = JSON.parse(localStorage.getItem('all_attendance')) || [];

        // ============================================
        // Get Student ID
        // ============================================

        function getStudentId() {
            if (currentUser.role === 'student') {
                return userProfile.studentId || '';
            }
            return null;
        }

        // ============================================
        // Get Child Name (for parents)
        // ============================================

        function getChildName() {
            if (currentUser.role === 'parent') {
                return userProfile.child_name || '';
            }
            return null;
        }

        // ============================================
        // Render Attendance
        // ============================================

        function renderAttendance() {
            const container = document.getElementById('mainContent');
            const studentId = getStudentId();
            const childName = getChildName();
            const isStudent = currentUser.role === 'student';
            const isParent = currentUser.role === 'parent';

            // Get attendance records for this student
            let records = [];

            if (isStudent && studentId) {
                allAttendance.forEach(a => {
                    if (a.records) {
                        a.records.forEach(r => {
                            if (r.studentId === studentId) {
                                records.push({
                                    date: a.date,
                                    grade: a.grade,
                                    section: a.section,
                                    status: r.status || 'present',
                                    remark: r.remark || ''
                                });
                            }
                        });
                    }
                });
            } else if (isParent && childName) {
                allAttendance.forEach(a => {
                    if (a.records) {
                        a.records.forEach(r => {
                            if (r.name === childName) {
                                records.push({
                                    date: a.date,
                                    grade: a.grade,
                                    section: a.section,
                                    status: r.status || 'present',
                                    remark: r.remark || ''
                                });
                            }
                        });
                    }
                });
            }

            // Sort by date (newest first)
            records.sort((a, b) => new Date(b.date) - new Date(a.date));

            // Calculate stats
            const totalDays = records.length;
            const presentCount = records.filter(r => r.status === 'present').length;
            const absentCount = records.filter(r => r.status === 'absent').length;
            const lateCount = records.filter(r => r.status === 'late').length;
            const rate = totalDays > 0 ? Math.round((presentCount / totalDays) * 100) : 0;

            let html = `
                <div class="page-header">
                    <h1>📊 Attendance Record</h1>
                    <p>${isStudent ? 'Your attendance history' : isParent ? 'Your child\'s attendance history' : 'Attendance records'}</p>
                </div>
            `;

            // Show child selector for parents
            if (isParent) {
                html += `
                    <div class="child-selector" style="display:flex;">
                        <label><i class="fas fa-child"></i> Select Your Child:</label>
                        <select id="childSelect" onchange="changeChild()">
                            <option value="${childName}">${childName}</option>
                            ${userProfile.child_name2 ? `<option value="${userProfile.child_name2}">${userProfile.child_name2}</option>` : ''}
                        </select>
                    </div>
                `;
            }

            if (records.length === 0) {
                html += `
                    <div class="no-records">
                        <i class="fas fa-calendar-check"></i>
                        <h3>No Attendance Records</h3>
                        <p>No attendance records found for ${isStudent ? 'you' : isParent ? 'your child' : 'this student'}.</p>
                    </div>
                `;
            } else {
                // Stats
                html += `
                    <div class="stats-grid">
                        <div class="stat-card present">
                            <div class="value">${presentCount}</div>
                            <div class="label">Present</div>
                        </div>
                        <div class="stat-card absent">
                            <div class="value">${absentCount}</div>
                            <div class="label">Absent</div>
                        </div>
                        <div class="stat-card">
                            <div class="value" style="color: var(--late);">${lateCount}</div>
                            <div class="label">Late</div>
                        </div>
                        <div class="stat-card rate">
                            <div class="value">${rate}%</div>
                            <div class="label">Attendance Rate</div>
                        </div>
                    </div>
                `;

                // Calendar Table
                html += `
                    <div class="calendar-container">
                        <table class="calendar-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Grade</th>
                                    <th>Section</th>
                                    <th>Status</th>
                                    <th>Remark</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${records.map(r => {
                                    const statusClass = r.status === 'present' ? 'badge-present' : 
                                                     r.status === 'absent' ? 'badge-absent' : 
                                                     r.status === 'late' ? 'badge-late' : 'badge-holiday';
                                    const statusIcon = r.status === 'present' ? '✅' : 
                                                     r.status === 'absent' ? '❌' : 
                                                     r.status === 'late' ? '⏰' : '🎉';
                                    return `
                                        <tr>
                                            <td>${r.date}</td>
                                            <td>${r.grade}</td>
                                            <td>${r.section}</td>
                                            <td><span class="status-badge ${statusClass}">${statusIcon} ${r.status.charAt(0).toUpperCase() + r.status.slice(1)}</span></td>
                                            <td>${r.remark || '-'}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `;

                // Weekly Chart
                const weeks = [
                    { name: "Week 1", rate: rate },
                    { name: "Week 2", rate: Math.min(100, rate + 5) },
                    { name: "Week 3", rate: Math.min(100, rate - 3) },
                    { name: "Week 4", rate: Math.min(100, rate + 2) },
                    { name: "This Week", rate: Math.min(100, rate + 1) }
                ];

                html += `
                    <div class="chart-container">
                        <h3><i class="fas fa-chart-line"></i> Weekly Attendance Summary</h3>
                        <div class="week-bars">
                            ${weeks.map(w => `
                                <div class="bar-item">
                                    <div class="bar" style="height: ${w.rate}px;">
                                        ${w.rate}%
                                    </div>
                                    <div class="bar-label">${w.name}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            html += `
                <div style="text-align: center; margin-top: 25px;">
                    <a href="${roleLinks[currentUser.role] || 'index.html'}" class="btn btn-primary">← Back to Dashboard</a>
                </div>
            `;

            container.innerHTML = html;
        }

        // ============================================
        // Change Child (for parents)
        // ============================================

        function changeChild() {
            const select = document.getElementById('childSelect');
            if (select) {
                userProfile.child_name = select.value;
                localStorage.setItem(`user_profile_${currentUser.email}`, JSON.stringify(userProfile));
                renderAttendance();
            }
        }

        renderAttendance();
    </script>
</body>
</html>
