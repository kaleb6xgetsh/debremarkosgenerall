<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Login - Debre Markos Secondary School</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-green: #047857;
            --ethio-green: #078930;
            --ethio-yellow: #FCDD09;
            --ethio-red: #DA121A;
            --text-dark: #1f2937;
            --text-soft: #4b5563;
            --bg-light: #f9fafb;
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #0a2e1a, #1a4a2a);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Ethiopian Flag Bar */
        .ethiopian-flag {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            height: 5px;
            z-index: 1001;
        }
        .ethiopian-flag .green { flex: 1; background: var(--ethio-green); }
        .ethiopian-flag .yellow { flex: 1; background: var(--ethio-yellow); }
        .ethiopian-flag .red { flex: 1; background: var(--ethio-red); }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Ethiopian Flag Pattern on Card */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--ethio-green) 33%, var(--ethio-yellow) 33% 66%, var(--ethio-red) 66%);
            border-radius: 32px 32px 0 0;
        }

        .login-card {
            position: relative;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header .school-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary-green), #065f46);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            color: white;
            font-size: 32px;
            box-shadow: 0 10px 30px rgba(4, 120, 87, 0.3);
        }

        .login-header h2 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-soft);
            margin-top: 5px;
        }

        .role-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .role-btn {
            padding: 8px 16px;
            border-radius: 30px;
            border: 2px solid #e5e7eb;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s;
            color: var(--text-soft);
        }

        .role-btn:hover {
            border-color: var(--primary-green);
            color: var(--primary-green);
        }

        .role-btn.active {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
        }

        .role-btn i {
            margin-right: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-dark);
        }

        .form-group .input-wrapper {
            position: relative;
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-soft);
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border-radius: 16px;
            border: 2px solid #e5e7eb;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(4, 120, 87, 0.1);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .form-options a {
            font-size: 13px;
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--ethio-red), #b91c1c);
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(218, 18, 26, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: var(--text-soft);
        }

        .login-footer a {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            animation: fadeInUp 0.3s ease;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border-left: 4px solid #22c55e;
        }

        .alert-info {
            background: #e0f2fe;
            color: #0369a1;
            border-left: 4px solid #0ea5e9;
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Back to Home */
        .back-home {
            text-align: center;
            margin-top: 15px;
        }
        .back-home a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 13px;
            transition: all 0.3s;
        }
        .back-home a:hover {
            color: white;
        }

        @media (max-width: 768px) {
            .login-card { padding: 30px 20px; }
            .role-btn { padding: 6px 12px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <div class="ethiopian-flag">
        <div class="green"></div>
        <div class="yellow"></div>
        <div class="red"></div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="school-icon">
                    <i class="fas fa-school"></i>
                </div>
                <h2>Welcome Back!</h2>
                <p>Sign in to your account</p>
            </div>

            <div id="alertMessage" class="alert"></div>

            <div class="role-selector" id="roleSelector">
                <button class="role-btn active" data-role="student" onclick="selectRole('student')">
                    <i class="fas fa-user-graduate"></i> Student
                </button>
                <button class="role-btn" data-role="teacher" onclick="selectRole('teacher')">
                    <i class="fas fa-chalkboard-user"></i> Teacher
                </button>
                <button class="role-btn" data-role="parent" onclick="selectRole('parent')">
                    <i class="fas fa-user-friends"></i> Parent
                </button>
                <button class="role-btn" data-role="admin" onclick="selectRole('admin')">
                    <i class="fas fa-user-shield"></i> Admin
                </button>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="Enter your email address" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required>
                    </div>
                </div>

                <div class="form-options">
                    <a href="/forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> <span id="loginBtnText">Login</span>
                </button>
            </form>

            <div class="login-footer">
                Don't have an account? <a href="/signup">Sign Up</a>
            </div>

            <div class="back-home">
                <a href="/"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // API Login Function
        // ============================================

        async function apiLogin(email, password, role) {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: email,
                    password: password,
                    role: role
                })
            });
            
            const data = await response.json();
            return data;
        }

        // ============================================
        // Selected Role
        // ============================================

        let selectedRole = "student";

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-role') === role) {
                    btn.classList.add('active');
                }
            });
            const roleNames = {
                student: "Student",
                teacher: "Teacher",
                parent: "Parent",
                admin: "Admin"
            };
            document.getElementById('loginBtnText').innerHTML = `Login as ${roleNames[role]}`;
        }

        // ============================================
        // Handle Login with Flask API
        // ============================================

        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const alertDiv = document.getElementById('alertMessage');
            const loginBtn = document.getElementById('loginBtn');

            // Reset alert
            alertDiv.style.display = 'none';

            // Validate
            if (!email || !password) {
                alertDiv.innerHTML = '❌ Please fill in all fields.';
                alertDiv.className = 'alert alert-error';
                alertDiv.style.display = 'block';
                return;
            }

            // Show loading
            loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
            loginBtn.disabled = true;

            try {
                // Call Flask API
                const result = await apiLogin(email, password, selectedRole);
                
                if (result.success) {
                    alertDiv.innerHTML = '✅ Login successful! Redirecting...';
                    alertDiv.className = 'alert alert-success';
                    alertDiv.style.display = 'block';

                    // Store user in session
                    sessionStorage.setItem('current_user', JSON.stringify(result.user));
                    localStorage.setItem('current_user', JSON.stringify(result.user));

                    // Redirect based on role
                    setTimeout(() => {
                        const redirects = {
                            'student': '/studenthome',
                            'teacher': '/teacherhome',
                            'parent': '/parenthome',
                            'admin': '/adminhome'
                        };
                        window.location.href = redirects[result.user.role] || '/';
                    }, 1000);
                    
                } else {
                    alertDiv.innerHTML = `❌ ${result.error}`;
                    alertDiv.className = 'alert alert-error';
                    alertDiv.style.display = 'block';
                }
            } catch (error) {
                alertDiv.innerHTML = '❌ Connection error. Please try again.';
                alertDiv.className = 'alert alert-error';
                alertDiv.style.display = 'block';
            }

            // Reset button
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span id="loginBtnText">Login</span>';
            loginBtn.disabled = false;
        }

        // ============================================
        // Enter key support
        // ============================================

        document.getElementById('loginPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });

        // ============================================
        // Check if already logged in
        // ============================================

        const currentUser = JSON.parse(sessionStorage.getItem('current_user')) || JSON.parse(localStorage.getItem('current_user'));

        if (currentUser) {
            const redirects = {
                'student': '/studenthome',
                'teacher': '/teacherhome',
                'parent': '/parenthome',
                'admin': '/adminhome'
            };
            window.location.href = redirects[currentUser.role] || '/';
        }

        // ============================================
        // Initialize
        // ============================================

        selectRole('student');
    </script>
</body>
</html>
