<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Post Results - Teacher Panel | Debre Markos Secondary School</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-green: #047857;
            --ethio-green: #078930;
            --ethio-yellow: #FCDD09;
            --ethio-red: #DA121A;
            --text-dark: #1f2937;
            --text-soft: #4b5563;
            --bg-light: #f9fafb;
            --shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #f0f4f8;
        }

        .ethiopian-flag {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            height: 5px;
            z-index: 1001;
        }
        .ethiopian-flag .green { flex: 1; background: var(--ethio-green); }
        .ethiopian-flag .yellow { flex: 1; background: var(--ethio-yellow); }
        .ethiopian-flag .red { flex: 1; background: var(--ethio-red); }

        nav {
            width: 100%;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #e5e7eb;
            box-shadow: var(--shadow);
            position: fixed;
            top: 5px;
            left: 0;
            z-index: 999;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
        }
        .nav-logo {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-green);
        }
        .nav-logo i {
            margin-right: 8px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-links a {
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 30px;
            transition: all 0.3s;
        }
        .nav-links a:hover {
            background: var(--primary-green);
            color: white;
        }
        .nav-links a.active {
            background: var(--primary-green);
            color: white;
        }
        .nav-links a.logout {
            background: var(--ethio-red);
            color: white;
        }
        .nav-links a.logout:hover {
            background: #b91c1c;
        }

        .menu-toggle {
            display: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-dark);
        }

        .main-content {
            padding-top: 80px;
            max-width: 1100px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            padding-bottom: 40px;
        }

        .page-header {
            margin-bottom: 30px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
        }
        .page-header p {
            color: var(--text-soft);
            font-size: 15px;
        }

        .form-card {
            background: white;
            border-radius: 24px;
            padding: 25px 30px;
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }
        .form-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--primary-green);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid var(--ethio-yellow);
            padding-left: 15px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-bottom: 18px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-dark);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            background: white;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.1);
        }

        .btn {
            display: inline-block;
            padding: 10px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-success {
            background: var(--primary-green);
            color: white;
        }
        .btn-success:hover {
            background: #065f46;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(4, 120, 87, 0.3);
        }
        .btn-secondary {
            background: #e5e7eb;
            color: var(--text-dark);
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }
        .btn-danger {
            background: var(--ethio-red);
            color: white;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .btn-sm {
            padding: 5px 14px;
            font-size: 12px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .alert {
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            animation: slideDown 0.4s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .alert-success {
            background: #dcfce7;
            color: #166534;
            border-left: 4px solid #22c55e;
        }
        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .students-table-container {
            overflow-x: auto;
            margin-top: 15px;
        }
        .students-table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
        }
        .students-table th {
            background: var(--primary-green);
            color: white;
            padding: 10px 14px;
            text-align: left;
            font-weight: 600;
        }
        .students-table td {
            padding: 10px 14px;
            border-bottom: 1px solid #e5e7eb;
        }
        .students-table tr:hover {
            background: #f3f4f6;
        }
        .students-table input[type="number"] {
            width: 80px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
        }
        .students-table input[type="number"]:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.1);
        }
        .students-table .grade-cell {
            font-weight: 700;
            font-size: 15px;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .summary-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 12px 15px;
            text-align: center;
        }
        .summary-card .number {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-green);
        }
        .summary-card .label {
            font-size: 11px;
            color: var(--text-soft);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            nav { padding: 10px 16px; }
            .nav-links { display: none; flex-direction: column; width: 100%; padding-top: 10px; }
            .nav-links.show { display: flex; }
            .nav-links a { width: 100%; text-align: center; padding: 8px; }
            .menu-toggle { display: block; }
            .form-row { grid-template-columns: 1fr; }
            .main-content { padding-top: 70px; padding-left: 12px; padding-right: 12px; }
            .form-card { padding: 20px; }
            .students-table { font-size: 12px; }
            .students-table th, .students-table td { padding: 6px 8px; }
            .students-table input[type="number"] { width: 60px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="ethiopian-flag">
        <div class="green"></div>
        <div class="yellow"></div>
        <div class="red"></div>
    </div>

    <nav>
        <div class="nav-container">
            <div class="nav-logo"><i class="fas fa-school"></i> DMSS</div>
            <div class="menu-toggle" onclick="toggleMenu()"><i class="fas fa-bars"></i></div>
            <div class="nav-links" id="navLinks">
                <a href="/teacherhome">← Back</a>
                <a href="/post-attendance">Attendance</a>
                <a href="/post-assignment">Assignments</a>
                <a href="/post-result" class="active">Results</a>
                <a href="/profile">Profile</a>
                <a href="/logout" class="logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-header">
            <h1>📊 Post Exam Results</h1>
            <p>Enter and publish student examination scores</p>
        </div>

        <div id="alertMessage" class="alert"></div>

        <!-- Select Exam Details -->
        <div class="form-card">
            <div class="form-title"><i class="fas fa-school"></i> Select Exam Details</div>
            <div class="form-row">
                <div class="form-group">
                    <label>Grade *</label>
                    <select id="gradeSelect" required>
                        <option value="">Select Grade</option>
                        <option value="Grade 8">Grade 8</option>
                        <option value="Grade 9">Grade 9</option>
                        <option value="Grade 10">Grade 10</option>
                        <option value="Grade 11">Grade 11</option>
                        <option value="Grade 12">Grade 12</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Section *</label>
                    <select id="sectionSelect" required>
                        <option value="">Select Section</option>
                        <option value="A">Section A</option>
                        <option value="B">Section B</option>
                        <option value="C">Section C</option>
                        <option value="D">Section D</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Subject *</label>
                    <select id="subjectSelect" required>
                        <option value="">Select Subject</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="English">English</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Biology">Biology</option>
                        <option value="History">History</option>
                        <option value="Geography">Geography</option>
                        <option value="ICT">ICT</option>
                        <option value="Amharic">Amharic</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Exam Type *</label>
                    <select id="examSelect" required>
                        <option value="">Select Exam</option>
                        <option value="Term 1">Term 1</option>
                        <option value="Term 2">Term 2</option>
                        <option value="Final">Final Exam</option>
                        <option value="Quiz">Quiz</option>
                        <option value="Mid-Term">Mid-Term</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-secondary" onclick="loadStudents()"><i class="fas fa-users"></i> Load Students</button>
        </div>

        <!-- Student Results -->
        <div id="studentsSection" class="form-card" style="display:none;">
            <div class="form-title"><i class="fas fa-user-graduate"></i> Student Results</div>

            <div class="summary-stats" id="summaryStats">
                <div class="summary-card"><div class="number" id="totalCount">0</div><div class="label">Students</div></div>
                <div class="summary-card"><div class="number" id="avgScore">-</div><div class="label">Average</div></div>
                <div class="summary-card"><div class="number" id="topScore">-</div><div class="label">Highest</div></div>
                <div class="summary-card"><div class="number" id="passCount">-</div><div class="label">Pass Rate</div></div>
            </div>

            <div class="students-table-container">
                <table class="students-table">
                    <thead>
                        <tr>
                            <th style="width: 30%;">Student Name</th>
                            <th style="width: 20%;">Student ID</th>
                            <th style="width: 25%;">Score (Out of 100)</th>
                            <th style="width: 25%;">Grade</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody"></tbody>
                </table>
            </div>

            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="clearResults()"><i class="fas fa-eraser"></i> Clear All</button>
                <button class="btn btn-success" onclick="publishResults()"><i class="fas fa-save"></i> Publish Results</button>
            </div>
        </div>

        <!-- Published Results -->
        <div class="form-card">
            <div class="form-title"><i class="fas fa-list"></i> Published Results</div>
            <div id="resultsList"></div>
        </div>
    </div>

    <script>
        // ============================================
        // Toggle Mobile Menu
        // ============================================

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('show');
        }

        // ============================================
        // Get Current User
        // ============================================

        const currentUser = JSON.parse(sessionStorage.getItem('current_user')) || JSON.parse(localStorage.getItem('current_user'));

        if (!currentUser || currentUser.role !== 'teacher') {
            window.location.href = '/login';
        }

        // ============================================
        // Students Database (from API)
        // ============================================

        let currentStudents = [];
        let studentScores = [];
        let allResults = [];

        // ============================================
        // Load Students from API
        // ============================================

        async function loadStudentsFromAPI() {
            try {
                const response = await fetch('/api/users?role=student');
                const data = await response.json();
                return data.users || [];
            } catch (error) {
                console.error('Error loading students:', error);
                return [];
            }
        }

        // ============================================
        // Load Published Results
        // ============================================

        async function loadPublishedResults() {
            try {
                const response = await fetch('/api/results');
                const data = await response.json();
                allResults = data.results || [];
                renderResultsList();
            } catch (error) {
                console.error('Error loading results:', error);
                allResults = [];
                renderResultsList();
            }
        }

        // ============================================
        // Load Students
        // ============================================

        async function loadStudents() {
            const grade = document.getElementById('gradeSelect').value;
            const section = document.getElementById('sectionSelect').value;
            const subject = document.getElementById('subjectSelect').value;
            const exam = document.getElementById('examSelect').value;

            if (!grade || !section || !subject || !exam) {
                showAlert('Please select Grade, Section, Subject, and Exam Type.', 'error');
                return;
            }

            try {
                const allUsers = await loadStudentsFromAPI();
                
                // Filter students by grade and section
                currentStudents = allUsers.filter(u => 
                    u.role === 'student' && 
                    u.grade === grade && 
                    u.section === section
                );

                if (currentStudents.length === 0) {
                    showAlert('No students found for the selected grade and section.', 'error');
                    return;
                }

                // Check if results already exist for this exam
                const existingResults = allResults.filter(r => 
                    r.grade_level === grade && 
                    r.section === section && 
                    r.subject === subject && 
                    r.exam_type === exam
                );

                if (existingResults.length > 0) {
                    studentScores = existingResults.map(r => ({
                        studentId: r.student_id,
                        name: r.student_name || 'Unknown',
                        score: r.score || '',
                        grade: r.grade || ''
                    }));
                    
                    // Add any missing students
                    currentStudents.forEach(s => {
                        if (!studentScores.find(r => r.studentId === s.id)) {
                            studentScores.push({
                                studentId: s.id,
                                name: s.name,
                                score: '',
                                grade: ''
                            });
                        }
                    });
                } else {
                    studentScores = currentStudents.map(student => ({
                        studentId: student.id,
                        name: student.name,
                        score: '',
                        grade: ''
                    }));
                }

                renderStudentTable();
                updateSummary();
                document.getElementById('studentsSection').style.display = 'block';
                showAlert(`✅ Loaded ${currentStudents.length} students for ${grade} - Section ${section}`, 'success');
            } catch (error) {
                showAlert('Error loading students. Please try again.', 'error');
            }
        }

        // ============================================
        // Calculate Grade
        // ============================================

        function calculateGrade(score) {
            if (score >= 90) return 'A';
            if (score >= 80) return 'B';
            if (score >= 70) return 'C';
            if (score >= 60) return 'D';
            return 'F';
        }

        function getGradeClass(grade) {
            if (grade === 'A' || grade === 'B') return 'grade-A';
            if (grade === 'C' || grade === 'D') return 'grade-C';
            return 'grade-F';
        }

        // ============================================
        // Render Student Table
        // ============================================

        function renderStudentTable() {
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = studentScores.map((student, index) => `
                <tr>
                    <td><strong>${student.name}</strong></td>
                    <td>${student.studentId}</td>
                    <td>
                        <input type="number" id="score_${index}" value="${student.score}" 
                            min="0" max="100" onchange="updateScore(${index}, this.value)" 
                            placeholder="0-100" step="0.5">
                    </td>
                    <td style="font-weight:700; color: ${student.grade === 'A' || student.grade === 'B' ? '#22c55e' : student.grade === 'C' || student.grade === 'D' ? '#f59e0b' : '#ef4444'}" id="grade_${index}">
                        ${student.grade || '-'}
                    </td>
                </tr>
            `).join('');
        }

        function updateScore(index, value) {
            const score = parseFloat(value);
            if (!isNaN(score) && score >= 0 && score <= 100) {
                studentScores[index].score = score;
                studentScores[index].grade = calculateGrade(score);
                const gradeEl = document.getElementById(`grade_${index}`);
                gradeEl.innerHTML = studentScores[index].grade;
                gradeEl.style.color = studentScores[index].grade === 'A' || studentScores[index].grade === 'B' ? '#22c55e' : 
                                      studentScores[index].grade === 'C' || studentScores[index].grade === 'D' ? '#f59e0b' : '#ef4444';
                updateSummary();
            }
        }

        // ============================================
        // Update Summary
        // ============================================

        function updateSummary() {
            const scores = studentScores.filter(s => s.score !== '' && !isNaN(s.score)).map(s => parseFloat(s.score));
            const total = studentScores.length;
            const passed = scores.filter(s => s >= 50).length;
            
            document.getElementById('totalCount').innerHTML = total;
            
            if (scores.length > 0) {
                const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
                const max = Math.max(...scores);
                const passRate = Math.round((passed / scores.length) * 100);
                document.getElementById('avgScore').innerHTML = avg.toFixed(1) + '%';
                document.getElementById('topScore').innerHTML = max + '%';
                document.getElementById('passCount').innerHTML = passRate + '%';
            } else {
                document.getElementById('avgScore').innerHTML = '-';
                document.getElementById('topScore').innerHTML = '-';
                document.getElementById('passCount').innerHTML = '-';
            }
        }

        // ============================================
        // Clear Results
        // ============================================

        function clearResults() {
            if (confirm('Clear all entered scores? This will reset all scores for this exam.')) {
                studentScores = studentScores.map(s => ({ ...s, score: '', grade: '' }));
                renderStudentTable();
                updateSummary();
                showAlert('✅ All scores cleared.', 'success');
            }
        }

        // ============================================
        // Publish Results - This sends to API
        // ============================================

        async function publishResults() {
            const grade = document.getElementById('gradeSelect').value;
            const section = document.getElementById('sectionSelect').value;
            const subject = document.getElementById('subjectSelect').value;
            const exam = document.getElementById('examSelect').value;

            const emptyScores = studentScores.filter(s => s.score === '' || isNaN(s.score));
            if (emptyScores.length > 0) {
                if (!confirm(`${emptyScores.length} student(s) have no score entered. Continue anyway?`)) {
                    return;
                }
            }

            // Prepare data for API
            const resultData = {
                grade_level: grade,
                section: section,
                subject: subject,
                exam_type: exam,
                results: studentScores.map(s => ({
                    student_id: s.studentId,
                    score: s.score || 0
                }))
            };

            try {
                const response = await fetch('/api/results/bulk', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(resultData)
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('✅ Results published successfully! Students can now view them.', 'success');
                    
                    // Hide student section
                    document.getElementById('studentsSection').style.display = 'none';
                    
                    // Reset form
                    document.getElementById('gradeSelect').value = '';
                    document.getElementById('sectionSelect').value = '';
                    document.getElementById('subjectSelect').value = '';
                    document.getElementById('examSelect').value = '';

                    // Reload published results
                    await loadPublishedResults();
                } else {
                    showAlert('❌ Error publishing results: ' + (data.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                showAlert('❌ Error publishing results. Please try again.', 'error');
            }
        }

        // ============================================
        // Render Results List
        // ============================================

        function renderResultsList() {
            const container = document.getElementById('resultsList');
            
            if (!allResults || allResults.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:30px; color: var(--text-soft);">
                        <i class="fas fa-file-alt" style="font-size: 40px; opacity: 0.3; margin-bottom: 10px;"></i>
                        <p>No results published yet.</p>
                        <p style="font-size: 13px; margin-top: 5px;">Publish your first exam results using the form above.</p>
                    </div>
                `;
                return;
            }

            // Group results by exam
            const grouped = {};
            allResults.forEach(r => {
                const key = `${r.subject}-${r.exam_type}-${r.grade_level}-${r.section}`;
                if (!grouped[key]) {
                    grouped[key] = {
                        subject: r.subject,
                        exam_type: r.exam_type,
                        grade_level: r.grade_level,
                        section: r.section,
                        count: 0,
                        id: r.id
                    };
                }
                grouped[key].count++;
            });

            container.innerHTML = Object.values(grouped).map(g => `
                <div style="background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <div>
                        <strong>📚 ${g.subject}</strong>
                        <span style="margin-left: 10px; background: #e0f2fe; color: #0369a1; padding: 2px 10px; border-radius: 30px; font-size: 11px;">${g.exam_type}</span>
                        <div style="font-size: 13px; color: var(--text-soft); margin-top: 3px;">
                            ${g.grade_level} - Section ${g.section} | ${g.count} students
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <span style="background: #dcfce7; color: #166534; padding: 3px 12px; border-radius: 30px; font-size: 11px; font-weight: 600;">✅ Published</span>
                        <button class="btn btn-danger btn-sm" onclick="deleteResult(${g.id})"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        // ============================================
        // Delete Result
        // ============================================

        async function deleteResult(id) {
            if (confirm('Delete these results? Students will no longer see them.')) {
                try {
                    const response = await fetch(`/api/results/${id}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    if (data.success) {
                        showAlert('✅ Results deleted successfully.', 'success');
                        await loadPublishedResults();
                    } else {
                        showAlert('❌ Error deleting results.', 'error');
                    }
                } catch (error) {
                    showAlert('❌ Error deleting results. Please try again.', 'error');
                }
            }
        }

        // ============================================
        // Show Alert
        // ============================================

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alertMessage');
            alertDiv.innerHTML = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 5000);
        }

        // ============================================
        // Initial Load
        // ============================================

        loadPublishedResults();
    </script>
</body>
</html>
